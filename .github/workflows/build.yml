name: Cloud AI Framework Compiler

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger a build from your browser

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Configure Java Development Kit (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Android SDK Environments
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK Licenses
      run: |
        yes | sdkmanager --licenses || true

    - name: Execute Framework Gradle Build
      run: gradle assembleDebug

    - name: Export Compiled Application Binary
      uses: actions/upload-artifact@v4
      with:
        name: NextGen-AI-Agent-APK
        path: build/outputs/apk/debug/app-debug.apk
